name: Test

# The extension test framework renders this repository's test documents and
# checks the dependency manifest. A pull request runs it unless it is still a
# draft, and the default activity types fire nothing when a pull request leaves
# draft, so `ready_for_review` is what runs it once the draft is lifted.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # `github.event.pull_request` is null on a push, so this reads true there.
    if: ${{ github.event.pull_request.draft != true }}
    uses: mcanouil/quarto-extension-test/.github/workflows/extension-test.yml@main
    with:
      quarto-channels: '["release", "pre-release"]'
      # The `check` commands of the test documents read the PDF with pdftotext.
      apt-packages: "poppler-utils"

  typst-library:
    # The Typst library tests compile tests/typst/*.typ with Quarto's Typst,
    # then run the Lua module tests.
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        quarto: [release, pre-release]
    steps:
      - uses: actions/checkout@v7

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ matrix.quarto }}

      - name: Run the Typst library and Lua module tests
        run: tests/typst/run.sh
